<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>veloxx11</title>
  <h1>hello!</h1>
  <h2> welcome to the best website you'll ever see :P  </h2>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }
  </style>
</head>

<body>
<section aria-labelledby="contact-heading">
      <h2 id="contact-heading">send me a message</h2>
      <form action="https://formspree.io/f/xjywlzar" method="POST">
        <input type="hidden" name="_subject" value="New message from your website">

        <label for="name">who are you </label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="reply-email">your email (optional)</label>
        <input id="reply-email" name="_replyto" type="email" autocomplete="email">

        <label for="message">type here</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">send message</button>
      </form>
      <p class="note">messages sent through formspree</p>
    </section>
</body>

</html>
